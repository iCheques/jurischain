name: Build & Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    name: Native C core (sanitized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build CLI (warnings as errors)
        run: gcc src/cli.c -Iinclude -o jurischain -O2 -Wall -Wextra -Werror
      - name: Run CLI & edge-case checks
        run: |
          ./jurischain 8 CI_Seed
          ! ./jurischain 1 ""
          ! ./jurischain abc CI_Seed
      - name: Core test under UBSan + ASan
        run: make test-c

  native-php:
    name: PHP ${{ matrix.php }} extension
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
      - name: Build extension (self-contained, as PIE does)
        run: |
          cd bindings/php
          phpize
          ./configure
          make -j"$(nproc)"
      - name: Run integration test
        run: php -dextension=bindings/php/modules/jurischain.so -d assert.exception=1 tests/test_php.php
      - name: Run phpt test
        run: |
          cd bindings/php
          php run-tests.php -d extension="$(pwd)/modules/jurischain.so" -q tests/juschain.phpt

  pie-package:
    name: PIE package (PHP extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer
      - name: Validate composer.json
        run: composer validate --strict
      - name: Download and verify PIE
        run: |
          curl -fsSL -o /usr/local/bin/pie \
            https://github.com/php/pie/releases/download/1.6.1/pie.phar
          echo "e99400532e25cd3b65cb7b6688df93c9296a689f01bb0a4471869a3cbbac83ba  /usr/local/bin/pie" | sha256sum -c -
          chmod +x /usr/local/bin/pie
      - name: Build extension via PIE
        # Register the checkout as a local path repository, then build the
        # package from it — the same phpize/configure/make pipeline users
        # get from `pie install credithub/jurischain`.
        run: |
          pie repository:add path .
          pie build "credithub/jurischain:*@dev"

  native-node:
    name: Node ${{ matrix.node }} native addon
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Build addon
        working-directory: bindings/node
        run: npm ci
      - name: Audit addon dependencies
        working-directory: bindings/node
        run: npm audit --audit-level=moderate
      - name: Run integration test
        run: node tests/test_node.js

  python:
    name: Python smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build native CLI
        run: make cli
      - name: Run smoke test
        run: python3 tests/test_python.py

  browser-bundle:
    name: ASM.js Build & Browser Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build ASM.js & CLI
        run: make all
      - name: Test ASM.js CLI
        run: node dist/jurischain-cli.js 5 CI_Seed
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Typecheck declarations
        run: npm run typecheck
      - name: Transpile & minify bundle
        run: npm run minify
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser test suite
        run: npx playwright test --project=browser

  test-docker:
    name: Docker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run containerized test suite
        run: ./build.sh test
