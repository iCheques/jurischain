name: Release

# Publishes to npm when a version tag (v*) is pushed (or on workflow_dispatch).
# Uses npm Trusted Publishing (OIDC) — no static NPM_TOKEN / NODE_AUTH_TOKEN
# secret is required and credentials never expire.
#
# One-time setup on npmjs.com (for both @credithub/jurischain and
# @credithub/jurischain-node → Settings → Trusted Publisher → GitHub Actions):
#   - Organization or user: iCheques
#   - Repository:           jurischain
#   - Workflow filename:    release.yml
#   - Environment name:     (leave blank)
#
# Both publish jobs are idempotent: if the version in package.json is
# already on the registry, the job skips publishing. This lets a single
# tag release either package independently — just bump the version of
# the package you want to ship.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-browser:
    name: Publish @credithub/jurischain (browser bundle)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 bundles npm >= 11.5.1, required for OIDC Trusted Publishing.
          # Do NOT set registry-url here: setup-node would write a .npmrc
          # referencing NODE_AUTH_TOKEN, which overrides OIDC auth.
          node-version: '24'
      - name: Build ASM.js bundle
        run: make all
      - name: Install dependencies
        run: npm ci
      - name: Typecheck declarations
        run: npm run typecheck
      - name: Transpile + minify bundle
        run: npm run minify
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Browser test suite
        run: npx playwright test --project=browser
      - name: Check if version is already published
        id: check
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "Version $PKG@$VER already on npm — skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm (OIDC Trusted Publishing)
        if: steps.check.outputs.published == 'false'
        # Scripts are skipped because the build/minify/test steps above
        # already did everything prepublishOnly would do (and the full
        # playwright e2e project needs Docker, which is covered by CI).
        run: |
          npm --version
          npm publish --access public --provenance --ignore-scripts

  publish-node:
    name: Publish @credithub/jurischain-node (native addon)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 bundles npm >= 11.5.1, required for OIDC Trusted Publishing.
          node-version: '24'
      - name: Build addon
        run: npm ci
        working-directory: bindings/node
      - name: Run integration test
        run: node tests/test_node.js
      - name: Copy header & license into package (prepack)
        run: npm run prepack
        working-directory: bindings/node
      - name: Check if version is already published
        id: check
        working-directory: bindings/node
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "Version $PKG@$VER already on npm — skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm (OIDC Trusted Publishing)
        if: steps.check.outputs.published == 'false'
        # prepack already ran above; --ignore-scripts keeps npm from
        # running the install script (node-gyp rebuild) during packing.
        working-directory: bindings/node
        run: |
          npm --version
          npm publish --access public --provenance --ignore-scripts

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [publish-browser, publish-node]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
